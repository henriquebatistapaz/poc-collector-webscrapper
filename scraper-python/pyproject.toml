[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "poc-collector-webscrapper"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.11,<3",
  "scrapy>=2.12,<3",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "jsonschema>=4.23,<5"]

[project.scripts]
webscrapper = "scraper_python.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
